name: AudioPro Multi-Platform CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Dart Analyze & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio_pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  build_android:
    name: Build Android (APK & AAB)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio_pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hydrate missing Android launcher & gradle wrapper assets
        run: |
          flutter create /tmp/scaffold --org com.audiopro --project-name audio_pro --platforms=android
          cp -rn /tmp/scaffold/android/* android/ || true
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable*/ic_launcher*
          cp -f /tmp/scaffold/android/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp -f /tmp/scaffold/android/settings.gradle.kts android/settings.gradle.kts
          cp -f /tmp/scaffold/android/build.gradle.kts android/build.gradle.kts
          cp -f /tmp/scaffold/android/app/build.gradle.kts android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          chmod +x android/gradlew || true
          flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --split-per-abi

      - name: Build Android Release AppBundle
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio_pro-android-release
          path: |
            audio_pro/build/app/outputs/flutter-apk/*.apk
            audio_pro/build/app/outputs/bundle/release/*.aab

  build_windows:
    name: Build Windows x64 Host
    needs: analyze_and_test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: audio_pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hydrate missing Windows Flutter CMake scaffold
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create "$env:TEMP\scaffold" --org com.audiopro --project-name audio_pro --platforms=windows
          if (!(Test-Path "windows\flutter")) { Copy-Item -Recurse "$env:TEMP\scaffold\windows\flutter" "windows\flutter" }
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath audio_pro-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_pro-windows-x64
          path: audio_pro/audio_pro-windows-x64.zip

  build_ios:
    name: Build iOS (Unsigned IPA Archive)
    needs: analyze_and_test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: audio_pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hydrate missing Xcode project & register Swift bridge
        run: |
          flutter create /tmp/scaffold --org com.audiopro --project-name audio_pro --platforms=ios
          cp -rn /tmp/scaffold/ios/* ios/ || true
          flutter pub get
          cd ios
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open("Runner.xcodeproj")
            target = proj.targets.find { |t| t.name == "Runner" }
            target.build_configurations.each do |config|
              config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"
            end
            group = proj.main_group.find_subpath("Runner", true)
            unless group.files.any? { |f| f.path == "AudioEngineBridge.swift" }
              ref = group.new_file("AudioEngineBridge.swift")
              target.add_file_references([ref])
            end
            proj.save
          '
          pod install --repo-update

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA Payload
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r ../../audio_pro-ios-unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_pro-ios-unsigned
          path: audio_pro/audio_pro-ios-unsigned.ipa
